<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Denzel Chingodza</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0d0e12;
      color: #edeae0;
      font-family: system-ui, -apple-system, 'Helvetica Neue', sans-serif;
      gap: 14px;
      text-align: center;
      padding: 2rem;
    }
    .code {
      font-size: 12px;
      color: #b8b4a8;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    h1 { font-size: 26px; font-weight: 400; letter-spacing: -0.01em; }
    p { color: rgba(237,234,224,0.35); font-size: 14px; }
    a {
      margin-top: 6px;
      color: #b8b4a8;
      font-size: 13px;
      text-decoration: none;
      border-bottom: 1px solid rgba(184,180,168,0.35);
      padding-bottom: 2px;
      transition: border-color 0.2s;
    }
    a:hover { border-bottom-color: #b8b4a8; }
  </style>
</head>
<body>
  <span class="code">404</span>
  <h1>Page not found</h1>
  <p>This page does not exist or has been moved.</p>
  <a href="/">Back to home</a>
</body>
</html>
